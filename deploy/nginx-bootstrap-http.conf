# Bootstrap config, used only to get the first certificate.
#
# Let's Encrypt's HTTP-01 challenge has to be answered over plain HTTP on port
# 80, which means nginx must already be serving the domain before any
# certificate exists. enable-https.sh installs this, obtains the cert, then
# replaces it with nginx-bergen2027.conf.

server {
    listen 80;
    listen [::]:80;
    server_name wavecoupling2027.eu www.wavecoupling2027.eu
                oceancoupling.eu www.oceancoupling.eu;

    # `^~` so this wins over the dotfile deny in the real config — the challenge
    # path starts with a dot, and blocking it silently breaks renewal months
    # from now, long after anyone remembers why.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 503;
    }
}

# Anything addressed to the bare IP or an unknown host gets nothing. Keeps the
# site from answering to whatever name a scanner happens to try.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
