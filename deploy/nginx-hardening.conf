# systemd drop-in installed to /etc/systemd/system/nginx.service.d/hardening.conf
#
# This is the load-bearing guardrail. The nginx config could name any docroot it
# likes; these directives decide what the process can actually see. ProtectHome
# gives the unit an empty /home in its mount namespace, so a docroot pointing at
# /home/ubuntu/.claude does not resolve to anything — the mistake becomes a 404
# instead of a disclosure. Enforced by the kernel, not by convention.
#
# Verify with:  systemd-analyze security nginx.service

[Service]
# /home, /root, /run/user appear empty to this unit.
ProtectHome=yes

# Whole filesystem read-only except the few paths nginx genuinely writes to.
ProtectSystem=strict
ReadWritePaths=/var/log/nginx /var/lib/nginx /run

PrivateTmp=yes
PrivateDevices=yes
NoNewPrivileges=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectHostname=yes
ProtectClock=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
