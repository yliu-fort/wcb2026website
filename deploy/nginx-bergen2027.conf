# Final config: HTTPS at oceancoupling.eu, everything else redirected there.
# Installed to /etc/nginx/sites-available/bergen2027 by enable-https.sh.
#
# The docroot is /var/www/bergen2027 — deliberately NOT the git checkout and NOT
# anywhere under /home. Nothing reaches it except via publish.sh. See README.md.

# --- port 80: ACME challenge, then redirect to HTTPS ------------------------
server {
    listen 80;
    listen [::]:80;
    server_name oceancoupling.eu www.oceancoupling.eu;

    # Renewal happens unattended every ~60 days. `^~` keeps this ahead of the
    # dotfile deny below, which would otherwise 403 the challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://oceancoupling.eu$request_uri;
    }
}

# --- www -> apex ------------------------------------------------------------
server {
    # nginx 1.24 (Ubuntu 24.04) predates the `http2 on;` directive added in
    # 1.25.1; the parameter form is the only one it understands.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.oceancoupling.eu;

    ssl_certificate     /etc/letsencrypt/live/oceancoupling.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oceancoupling.eu/privkey.pem;

    return 301 https://oceancoupling.eu$request_uri;
}

# --- the site ---------------------------------------------------------------
server {
    # nginx 1.24 (Ubuntu 24.04) predates the `http2 on;` directive added in
    # 1.25.1; the parameter form is the only one it understands.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oceancoupling.eu;

    ssl_certificate     /etc/letsencrypt/live/oceancoupling.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oceancoupling.eu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    root /var/www/bergen2027;
    index index.html;

    # No directory listings, ever. A missing index.html should be a 403, not an
    # inventory of the directory.
    autoindex off;
    server_tokens off;

    # A symlink in the docroot would otherwise be a way out of it. ProtectHome
    # already blocks the /home case; this closes /etc and everything else.
    disable_symlinks on;

    # Self-hosted copy is built with --base=/ and served at the root. The
    # GitHub Pages copy keeps base '/wcb2026website/'; redirect that path so a
    # link copied from there still lands somewhere sensible.
    location ^~ /wcb2026website/ {
        return 301 https://oceancoupling.eu/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Belt and braces: even if a dotfile lands in the docroot it is not served.
    # publish.sh should have refused it long before this point.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Vite content-hashes assets, so they can be cached hard; index.html must
    # not be, or visitors pin an old build.
    location ~* ^/assets/.*\.(js|css|woff2?|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# --- catch-all --------------------------------------------------------------
# Requests to the bare IP, or to any hostname we do not serve, get nothing.
# Without this, nginx would answer them with the first server block above and
# quietly tie the address to the site for anyone scanning the range.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
