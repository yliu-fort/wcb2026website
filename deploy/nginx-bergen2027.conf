# Static-only site config. Installed to /etc/nginx/sites-available/bergen2027.
#
# The docroot is /var/www/bergen2027 — deliberately NOT the git checkout and NOT
# anywhere under /home. Nothing reaches this directory except via publish.sh,
# which scans what it copies. See deploy/README.md.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/bergen2027;
    index index.html;

    # A symlink in the docroot would otherwise be a way out of it. ProtectHome
    # already blocks the /home case; this closes /etc and everything else.
    disable_symlinks on;

    # No directory listings, ever. If index.html is missing we want a 403, not
    # an inventory of the directory.
    autoindex off;
    server_tokens off;

    # The site is built with Vite base '/wcb2026website/' so that one artifact
    # works both here and at yliu-fort.github.io/wcb2026website/. Send the bare
    # root there rather than 404ing.
    location = / {
        return 302 /wcb2026website/;
    }

    # Files live at /var/www/bergen2027/wcb2026website/, so `root` maps the URL
    # prefix directly. (Using `alias` here instead would hit the well-known
    # alias+try_files path-resolution bug.)
    location /wcb2026website/ {
        try_files $uri $uri/ /wcb2026website/index.html;
    }

    # Belt and braces: even if a dotfile somehow lands in the docroot, it is not
    # served. publish.sh should have refused it long before this point.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Static assets are content-hashed by Vite; index.html must not be cached or
    # visitors pin an old build.
    location ~* ^/wcb2026website/assets/.*\.(js|css|woff2?|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /wcb2026website/index.html {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
